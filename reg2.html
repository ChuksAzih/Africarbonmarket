<!-- Travel and Participation Information -->
<div class="travel-participation-form">

    <h3>Travel and Participation Information</h3>
    <p>Please provide details about your journey to the event.</p>

    <!-- City of Departure -->
    <div class="form-group">
        <label for="departure-city">City of Departure <span>*</span></label>
        <input type="text" id="departure-city" name="departure_city" placeholder="Enter city of departure" required>
    </div>

    <!-- State of Departure -->
    <div class="form-group">
        <label for="departure-state">State of Departure <span>*</span></label>
        <input type="text" id="departure-state" name="departure_state" placeholder="Enter state of departure" required>
    </div>

    <!-- Mode of Transportation -->
    <div class="form-group">
        <label for="transport-mode">Primary Mode of Transportation <span>*</span></label>
        <select id="transport-mode" name="transport_mode" required>
            <option value="">Select mode of transportation</option>
            <option value="Air">Air</option>
            <option value="Rail">Rail</option>
            <option value="Road">Road</option>
            <option value="Water">Water</option>
        </select>
    </div>

    <!-- Vehicle Type: Displayed only for Road -->
    <div class="form-group" id="vehicle-group" hidden>
        <label for="vehicle-type">Vehicle of Travel <span>*</span></label>
        <select id="vehicle-type" name="vehicle_type" disabled>
            <option value="">Select vehicle type</option>
            <option value="Bus">Bus</option>
            <option value="Car">Car</option>
            <option value="Tricycle">Tricycle</option>
            <option value="Motorcycle">Motorcycle</option>
            <option value="Bicycle">Bicycle</option>
            <option value="Walking/Trekking">Walking/Trekking</option>
            <option value="Other">Other</option>
        </select>
    </div>

    <!-- Other Vehicle Specification -->
    <div class="form-group" id="other-vehicle-group" hidden>
        <label for="other-vehicle">Please Specify Vehicle <span>*</span></label>
        <input type="text" id="other-vehicle" name="other_vehicle" placeholder="Specify your vehicle" disabled>
    </div>

</div>

<style>
    .travel-participation-form {
        width: 100%;
        max-width: 650px;
        margin: 20px 0;
        font-family: Arial, sans-serif;
        color: #222;
    }

    .travel-participation-form h3 {
        font-size: 22px;
        margin-bottom: 8px;
    }

    .travel-participation-form p {
        color: #666;
        font-size: 14px;
        margin-bottom: 24px;
    }

    .travel-participation-form .form-group {
        margin-bottom: 20px;
    }

    .travel-participation-form label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 14px;
    }

    .travel-participation-form label span {
        color: #d93025;
    }

    .travel-participation-form input,
    .travel-participation-form select {
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background-color: #fff;
        font-size: 15px;
    }

    .travel-participation-form input:focus,
    .travel-participation-form select:focus {
        outline: none;
        border-color: #2457a7;
        box-shadow: 0 0 0 2px rgba(36, 87, 167, 0.12);
    }

    .travel-participation-form [hidden] {
        display: none !important;
    }
</style>

<script>
    (function () {
        const mode = document.getElementById('transport-mode');
        const vehicleGroup = document.getElementById('vehicle-group');
        const vehicle = document.getElementById('vehicle-type');
        const otherGroup = document.getElementById('other-vehicle-group');
        const otherVehicle = document.getElementById('other-vehicle');

        function updateVehicleFields() {
            const isRoad = mode.value === 'Road';

            vehicleGroup.hidden = !isRoad;
            vehicle.disabled = !isRoad;
            vehicle.required = isRoad;

            if (!isRoad) {
                vehicle.value = '';
            }

            const showOther = isRoad && vehicle.value === 'Other';

            <otherGroup class="hidden"></otherGroup>
